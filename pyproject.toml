[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalclassifier"
version = "0.1.0"
description = "Local SDR acquisition and reproducible, explainable radio classification laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "numpy>=1.26,<3", "scipy>=1.12,<2", "psutil>=5.9,<8"]

[project.optional-dependencies]
neural = ["torch>=2.6,<3"]
pluto = ["pyadi-iio>=0.0.19,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
signalclassifier = "signalclassifier.__main__:main"

[tool.setuptools.package-data]
signalclassifier = ["static/**/*", "static/*"]

[tool.setuptools.packages.find]
include = ["signalclassifier*"]
namespaces = false
